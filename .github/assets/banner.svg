<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Armenian Speaker</title>
  <desc id="desc">Hear Armenian. Keep it local. Native macOS speech and Russian translation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17192f"/><stop offset="1" stop-color="#29214d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#aca0ff"/><stop offset="1" stop-color="#70e0bd"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <circle cx="1090" cy="40" r="230" fill="#7462ce" opacity=".09"/>
  <circle cx="960" cy="355" r="210" fill="#5cc8ac" opacity=".05"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="77" fill="#bcb6df" font-size="13" font-weight="600" letter-spacing="3">ARMENIAN · RUSSIAN · OFFLINE</text>
    <text x="60" y="158" fill="#ffffff" font-size="58" font-weight="700" letter-spacing="-2">Armenian Speaker</text>
    <text x="64" y="207" fill="#cbc6e4" font-size="25">Hear Armenian. Keep it local.</text>
    <rect x="64" y="254" width="156" height="34" rx="17" fill="#ffffff" opacity=".08"/>
    <text x="142" y="276" text-anchor="middle" fill="#e3dff5" font-size="13">Native macOS app</text>
    <rect x="232" y="254" width="178" height="34" rx="17" fill="#ffffff" opacity=".08"/>
    <text x="321" y="276" text-anchor="middle" fill="#e3dff5" font-size="13">Free &amp; open source</text>
    <text x="970" y="160" text-anchor="middle" fill="#e9e5ff" font-family="'Noto Sans Armenian', 'Mshtakan', sans-serif" font-size="60">Բարև</text>
  </g>
  <path d="M858 222v12 M882 208v40 M906 219v18 M930 191v74 M954 205v46 M978 180v96 M1002 200v55 M1026 210v35 M1050 194v68 M1074 215v24 M1098 222v10" stroke="url(#accent)" stroke-width="9" stroke-linecap="round"/>
</svg>
